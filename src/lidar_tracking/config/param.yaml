/**:
  ros__parameters:
    # =============================================================
    #  lidar_tracking v5.1 参数 (唯一调参入口)
    #  节点无论如何都读【本文件】: ~/racecar/src/lidar_tracking/config/param.yaml
    #  改完必须【重启节点】才生效 (节点只在启动时读一次)。
    # =============================================================

    # ===== 1. 速度控制 (PWM: 1500=停止, 1525 低速, 1540 巡航, 1560 快) =====
    speed_straight: 1535        # 直道巡航 (★想更慢就往下调, 如 1530/1525)
    speed_corner: 1530          # 常规圆弧弯道
    speed_sharp: 1520           # 直角弯低速防推头
    danger_slow_drop: 10        # 逼近锥桶额外减速量

    # ===== 2. 舵机标定 (本车实测: 中位 82.5, 物理范围 35~130) =====
    servo_center: 82.5          # 直行中位舵角 [deg]
    servo_min: 35.0             # 机械物理右极限 [deg]
    servo_max: 130.0            # 机械物理左极限 [deg]
    servo_deg_per_curv: 68.0    # 转向增益 [deg/(1/m)]
    max_curvature: 0.70         # 物理最大曲率 [1/m]
    steer_gain: 1.35            # 纯追踪中轴导向系数
    steer_gain_sharp: 1.45      # 直角弯快速响应转向增益
    max_k_rate: 0.25            # 每帧曲率变化上限 (杜绝猛打方向)

    # ===== 3. 直道自适应与状态机门限 =====
    curv_enter_corner: 0.18     # 进入常规弯道曲率阈值 [1/m]
    curv_exit_corner: 0.08      # 退出常规弯道曲率阈值 [1/m]
    lookahead_straight: 1.60    # 直道前瞻距离 [m]
    lookahead_corner: 1.05      # 弯道前瞻距离 [m]

    # ===== 4. 自适应聚类与半径推广 =====
    cd_range_min: 0.25
    cd_range_max: 4.20
    cd_fov_deg: 105.0
    cd_gap_base: 0.045
    cd_gap_slope: 0.020
    cd_min_points: 3
    cd_min_extent: 0.018
    cd_max_extent: 0.30
    cd_cone_radius: 0.08
    win_x_min: 0.10

    # ===== 5. 车体系短时记忆 =====
    mem_ttl: 1.5
    mem_match_gate: 0.45
    mem_min_hits: 2
    track_width_nominal: 1.50

    # ===== 6. 直角弯检测专用 =====
    sharp_front_detect_dist: 2.80   # 直角弯前方外侧挡墙检测距离 [m]
    sharp_inner_max_dist: 1.80      # 直角弯内折顶点最大搜索距离 [m]

    # ===== 7. 弧线安全避障层 =====
    safe_enable: true
    safe_lookahead: 1.30
    safe_radius: 0.26
    safe_front: 0.20
    safe_curv_steps: 21

    # ===== 8. 起步保护 =====
    start_guard_s: 1.5
    start_k_max: 0.20

    # ===== 9. 运行记录与调试 =====
    debug_every: 5
    debug_csv: 1
    debug_csv_dir: "~/racecar/logs"
